<!DOCTYPE html>

        nav { background: #fff; display: flex; justify-content: center; padding: 15px 0; border-bottom: 2px solid var(--dark); position: sticky; top: 0; z-index: 1000; flex-wrap: wrap; }
        nav div { padding: 8px 15px; margin: 0 5px; cursor: pointer; font-weight: bold; font-size: 0.9rem; color: #555; border-radius: 5px; transition: 0.3s; }
        nav div:hover, nav div.active { background: var(--dark); color: #fff; }
        .search-area { padding: 20px; text-align: center; background: #fff; }

        .card-header h3 { margin: 0; font-size: 1.05rem; }
        .formula { font-size: 0.85rem; color: #888; font-weight: normal; margin-left: 10px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; color: #fff; font-weight: bold; }
        .grade-danger { background: var(--danger); }
        .grade-warning { background: var(--warning); }
        .grade-normal { background: var(--success); }
        .card-content { display: none; padding: 20px; background: #fafafa; }
        .card-content.show { display: block; }
        .info-section { margin-bottom: 15px; padding-left: 10px; border-left: 3px solid #ddd; }
        .info-title { font-weight: bold; color: var(--dark); margin-bottom: 5px; display: block; }
        .info-text { font-size: 0.9rem; line-height: 1.6; color: #444; white-space: pre-wrap; }
    </style>
</head>

    function getReagentContent(reagent, category) {
        const name = reagent.n;
        const p = reagent.prop;

        if (category === 'list') {
            return `구분명: 교내 과학실 보유 물질 리스트 확보 내역\n해당 시약은 다산고등학교 과학실 내에 실물 재고가 확보된 물질입니다.\n정기적인 실사 조사를 통해 품명, 화학식 및 상태가 최종 확인 및 기록되었습니다.`;
        }

        if (category === 'danger') {
            const gradeText = reagent.g === 'danger' ? '위험 등급' : (reagent.g === 'warning' ? '주의 등급' : '보통 등급');

            }
            if (name.includes("차아염소산나트륨")) return `💥 관련 위험 반응 원리 [번호 1]:\n염산/황산 + 차아염소산나트륨 혼합 시 강력한 산화-환원 반응이 발생하여 눈과 호흡기를 파괴하는 맹독성 염소 가스(Cl₂)가 폭발적으로 분출됩니다.\n(출처: 화학물질안전원 사고대비물질 가이드북 '차아염소산나트륨' [취급주의사항] 3행)`;
            if (name.includes("싸이오사이안산칼륨")) return `💥 관련 위험 반응 원리 [번호 2]:\n염산/황산 + 싸이오사이안산칼륨 혼합 시 산성 환경에서 착이온이 분해되며 맹독성 황화수소(H₂S) 및 시안화 가스가 발생합니다.\n(출처: 안전보건공단 MSDS '싸이오사이안산칼륨' [10. 안정성 및 반응성] 4행)`;
            if (name.includes("페로시안화칼륨")) return `💥 관련 위험 반응 원리 [번호 3]:\n염산/황산 + 페로시안화칼륨 혼합 시 착염 구조가 파괴되면서 치명적인 시안화수소(HCN, 청산가스)가 공기 중으로 방출됩니다.\n(출처: 안전보건공단 MSDS '페로시안화칼륨' [10. 안정성 및 반응성] 2행)`;
            if (name.includes("수소화붕소나트륨")) return `💥 관련 위험 반응 원리 [번호 4 / 19]:\n- 염산/황산 혼합 시 수소화물과 수소 이온이 반응하여 극인화성인 수소 가스(H₂) 대량 발생 및 발열 화재.\n- 금속 염류 혼합 시 강력한 환원 반응에 의해 금속 이온이 금속 나노입자로 환원되며 막대한 열과 가스 발생. (출처: MSDS 10항)`;
            if (name.includes("암모니아수")) return `💥 관련 위험 반응 원리 [번호 5 / 15]:\n- 황산 혼합 시 격렬한 산-염기 중화열로 인해 암모니아 기체가 폭발적으로 기화하고 황산 액체가 사방으로 튐.\n- 질산은 혼합 시 방치하면 마찰·충격에 극도로 민감한 폭발성 뇌은(Ag₃N) 침전물이 생성되어 대폭발 위험. (출처: MSDS 10항)`;
            if (name.includes("탄산나트륨") || name.includes("탄산수소나트륨") || name.includes("탄산칼슘") || name.includes("탄산구리")) return `💥 관련 위험 반응 원리 [번호 6]:\n염산/황산 + 탄산염 시약 혼합 시 급격한 이산화탄소(CO₂) 가스 발생으로 밀폐 용기 내 압력이 급증하여 용기 파손 및 액체 분출 현상이 일어납니다.\n(출처: 안전보건공단 MSDS '탄산나트륨' [10. 안정성 및 반응성] 3행)`;
            if (name.includes("아황산수소나트륨")) return `💥 관련 위험 반응 원리 [번호 7]:\n염산/황산 + 아황산수소나트륨용액 혼합 시 산성 조건에서 아황산 이온이 분해되며 호흡기를 심하게 자극하는 독성 이산화황(SO₂) 가스가 방출됩니다.\n(출처: 안전보건공단 MSDS '아황산수소나트륨' [10. 안정성 및 반응성] 3행)`;
            if (name.includes("철가루")) return `💥 관련 위험 반응 원리 [번호 8 / 16]:\n- 산과 반응 시 금속의 산산화 반응으로 인해 인화성 수소 가스(H₂)가 발생하여 화재 위험 유발.\n- 과산화수소와 반응 시 촉매 분해를 유도하여 고온의 산소 가스와 물이 격렬히 방출됨. (출처: MSDS 10항)`;
            if (name.includes("아세톤") || name.includes("부탄올") || name.includes("헥산") || name.includes("에틸아세테이트")) {
                if (name.includes("아세톤")) return `💥 관련 위험 반응 원리 [번호 9 / 11 / 20]:\n- 황산과 결합 시 급격한 탄화 반응 및 발열 화재.\n- 과산화수소와 결합 시 극도로 민감한 폭발 물질(TATP) 생성.\n- 유기용매 혼합 시 공기 중 증기압 상승으로 정전기 스파크에 의한 전면 화재 위험. (출처: MSDS 10항)`;
                return `💥 관련 위험 반응 원리 [번호 9 / 20]:\n- 황산과 결합 시 강산의 탈수 작용으로 급격한 발열, 유기 가스 증발 및 화재 유발.\n- 타 유기용매와 혼합 시 인화점 변동 및 증기압 상승으로 스파크 화재 위험. (출처: MSDS 10항)`;
            }
            if (name.includes("과산화수소")) return `💥 관련 위험 반응 원리 [분류 2]:\n- 무수아세트산/아세톤 혼합 시 충격과 마찰에 극도로 취약한 유기 과산화물(과아세트산, TATP)이 생성되어 스스로 대폭발.\n- 디클로로메탄 혼합 시 광화학 분해로 맹독성 포스겐(COCl₂) 가스 형성.\n- 이산화망간/철가루 혼합 시 폭발적 분해로 고온 산소 분출. (출처: MSDS 10항)`;
            if (name.includes("무수아세트산")) return `💥 관련 위험 반응 원리 [번호 10]:\n과산화수소 + 무수아세트산 혼합 시 충격과 마찰에 극도로 취약한 유기 과산화물(과아세트산)이 생성되어 가만히 두어도 스스로 대폭발하는 위험을 초래합니다.\n(출처: 안전보건공단 MSDS '무수아세트산' [10. 안정성 및 반응성] 2행)`;
            if (name.includes("과망간산칼륨") || name.includes("과황산칼륨")) return `💥 관련 위험 반응 원리 [번호 12 / 13]:\n- 글리세롤 혼합 시 다가 알코올이 급격히 산화되면서 불씨 없이 수초 내에 불이 붙는 자연 발화현상 발생.\n- 숯가루/붉은 인 혼합 시 가연성 분말과 물리적 마찰에 의해 흑색 화약처럼 격렬히 대폭발함. (출처: MSDS 10항)`;
            if (name.includes("글리세롤")) return `💥 관련 위험 반응 원리 [번호 12]:\n과망간산칼륨/과황산칼륨 + 글리세롤 혼합 시 다가 알코올인 글리세롤이 급격히 산화되면서 불씨 없이 수초 내에 불이 붙는 자연 발화현상이 발생합니다.\n(출처: 안전보건공단 MSDS '과망간산칼륨' [10. 안정성 및 반응성] 2행)`;
            if (name.includes("숯가루") || name.includes("붉은 인")) return `💥 관련 위험 반응 원리 [번호 13]:\n과망간산칼륨/과황산칼륨 + 가연성 분말(숯가루, 붉은 인) 혼합 후 마찰이 생기면 흑색 화약과 같은 메커니즘으로 격렬한 폭발 및 유독 가스가 분출됩니다.\n(출처: 안전보건공단 MSDS [10. 안정성 및 반응성])`;
            if (name.includes("디클로로메탄")) return `💥 관련 위험 반응 원리 [번호 14 / 20]:\n- 과산화수소 혼합 시 광화학적 산화 분해 반응에 의해 과거 화학무기로 쓰인 맹독성 포스겐(COCl₂) 가스를 형성합니다.\n- 아세톤 등과 혼합 시 유기 증기압 상승으로 대형 화재 위험. (출처: MSDS 10항 유해분해산물 1행)`;
            if (name.includes("염화세바코일")) return `💥 관련 위험 반응 원리 [번호 21]:\n염화세바코일 + 헥사메틸렌디아민 계면 중합 반응(나일론 합성 실험) 진행 시, 부반응물로 독성 염화수소(HCl) 가스가 다량 발생하여 대기 중으로 확산됩니다.\n(출처: 안전보건공단 MSDS '염화세바코일' [10. 안정성 및 반응성] 유해분해산물 2행)`;
            if (name.includes("헥사메틸렌디아민")) return `💥 관련 위험 반응 원리 [번호 21]:\n염화세바코일 + 헥사메틸렌디아민 계면 중합 실험 시 강한 부식성을 지닌 독성 염화수소(HCl) 가스가 방출되므로 반드시 후드 장치 내부에서 실험을 수행해야 합니다.\n(출처: 안전보건공단 MSDS '염화세바코일' [10. 안정성 및 반응성])`;
            if (name.includes("펠링용액")) return `💥 관련 위험 반응 원리 [번호 22]:\n펠링용액A(황산구리) + 펠링용액B 혼합 후 장시간 방치하거나 강하게 가열 시, 구리 이온의 급격한 환원으로 인한 과열 및 용액이 끓어 넘치는 돌끓음(Bump) 현상이 발생합니다.\n(출처: 안전보건공단 MSDS '수산화나트륨' [10. 안정성 및 반응성] 4행)`;
            if (name.includes("이산화망간")) return `💥 관련 위험 반응 원리 [번호 16]:\n과산화수소 + 이산화망간 반응 시 이산화망간이 정촉매로 작용하여 과산화수소를 폭발적으로 분해시키며 고온의 산소 가스와 끓는 물을 사방으로 비산시킵니다.\n(출처: 안전보건공단 MSDS '과산화수소' [10. 안정성 및 반응성] 2행)`;

            return `🧬 해당 시약 반응 특성:\n본 ${name} 시약은 단독 조건에서는 안정적이나 타 시약과의 혼합 반응 시 열역학적 변화를 유도할 수 있습니다.\n실험 지침서 외 개별적인 혼합을 전면 금지하며 교내 안전 수칙과 폐액 처리 프로세스를 엄격히 이행해야 합니다.`;
        }

        if (category === 'body') {
            // 신체변화 매칭 로직
            let bodyText = `👤 1. 피부 접촉 시 신체 변화\n(피부는 인체의 1차 방어막이지만 강한 화학 물질은 이를 손상시키거나 체내로 침투할 수 있음)\n`;
            if (reagent.g === 'danger' && (p.includes("산성") || p.includes("염기") || p.includes("독성"))) {
                if (p.includes("산성")) {
                    bodyText += ` (1) 화학적 화상: 염산, 황산 같은 강산은 단백질을 변성시켜 조직을 완전히 파괴합니다.\n`;
                } else if (p.includes("염기")) {
                    bodyText += ` (1) 화학적 화상: 수산화나트륨 같은 강염기는 단백질을 분해하고 지방을 비누화하여 피부 깊숙히 침투하므로 산보다 훨씬 심각한 심부 조직 화상을 유발합니다.\n`;
                } else {
                    bodyText += ` (2) 접촉성 피부염: 표피층 자극에 의해 붉은 반점, 부종, 가려움이 발생하며 알레르기 동반 시 만성 물집이 형성됩니다.\n`;
                }
            } else if (p.includes("용제") || p.includes("인화성")) {
                bodyText += ` (3) 체내 흡수: 유기용제(헥산, 아세톤 등)는 피부 고유의 지방층을 빠르게 용해하여 모세혈관으로 직접 흡수되며, 이는 간 및 신장 등 내부 장기에 전신 독성을 유발할 수 있습니다.\n`;
            } else {
                bodyText += ` (2) 접촉성 피부염: 분말 및 가루 성상 물질 노출 시 기계적 마찰과 결합하여 표피 자극, 붉은 반점, 가려움증을 동반합니다.\n`;
            }

            bodyText += `\n👃 2. 흡입 시 신체 변화\n(기체나 증기 형태의 화학 물질은 호흡기를 통해 빠르게 체내에 들어갑니다.)\n`;
            if (p.includes("가스") || p.includes("산성") || name.includes("암모니아") || name.includes("차아염소산")) {
                bodyText += ` (1) 기도 및 폐 점막 자극: 염소, 암모니아, 이산화황 등은 점막 수분과 반응하여 강한 자극성 물질을 형성, 기침, 가래, 호흡 곤란을 유발하며 심한 경우 폐부종을 일으켜 산소 교환 장애를 유발합니다.`;
            } else if (name.includes("페로시안") || name.includes("싸이오사이안") || name.includes("세바코일")) {
                bodyText += ` (2) 질식 작용 (시안화수소류): 미토콘드리아의 산소 이용 과정을 직접적으로 방해하여 신체 시스템 전반에 세포 수준의 치명적인 질식을 발생시킵니다.`;
            } else if (p.includes("용제") || name.includes("아세톤") || name.includes("디클로로")) {
                bodyText += ` (3) 신경계 영향: 휘발성이 강한 유기용제 증기는 폐포를 통해 혈류로 넘어가 중추신경계에 직접 작용하여 현기증, 극심한 두통, 환각 및 의식 저하를 유발합니다.`;
            } else {
                bodyText += ` (1) 호흡기 분진 자극: 분말 가루(석고, 탄산칼슘 등) 흡입 시 호흡기 상피 세포를 자극하여 기침 및 기도 기계적 폐쇄 자극을 일으킵니다.`;
            }
            return bodyText;
        }
    }

    function render(filter = "") {
        const container = document.getElementById('reagentContainer');
        container.innerHTML = "";
        
        reagentData.forEach((data, index) => {
            if (filter && !data.n.toLowerCase().includes(filter.toLowerCase())) return;

            const card = document.createElement('div');
            card.className = 'reagent-card';
            const gradeText = data.g === 'danger' ? '위험' : (data.g === 'warning' ? '주의' : '보통');
            
            // 실시간 카테고리별 데이터 로드
            const contentText = getReagentContent(data, currentCategory);

            card.innerHTML = `
                <div class="card-header" onclick="toggleCard(${index})">
                    <h3>${data.n} <span class="formula">${data.f !== '-' ? data.f : ''}</span></h3>
                    <div class="badge-group">
                        <span class="badge grade-${data.g}">${gradeText}</span>
                        <span class="badge" style="background:#7f8c8d;">${data.prop}</span>
                    </div>
                </div>
                <div class="card-content" id="content-${index}">
                    <div class="info-section">
                        <span class="info-title">${getTitle(currentCategory)}</span>
                        <p class="info-text">${contentText}</p>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function getTitle(cat) {
        if(cat === 'list') return "📦 교내 과학실 보유 화학 물질 리스트 확보";
        if(cat === 'danger') return "⚠️ 위험 등급 분류 및 세부 특성";
        if(cat === 'theory') return "🧬 특정 시약 반응 원리 (MSDS 위험 혼합 데이터)";
        return "👤 화학 물질 노출 시 신체 변화 및 메커니즘";
    }

    function toggleCard(index) {
        document.getElementById(`content-${index}`).classList.toggle('show');
    }

    function changeTab(cat, el) {
        currentCategory = cat;
        document.querySelectorAll('nav div').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
        render(document.getElementById('searchInput').value);
    }

    function searchReagent() {
        render(document.getElementById('searchInput').value);
    }

    // 초기 구동
    render();
</script>

</body>
</html>
